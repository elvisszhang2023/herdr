id = "example.agent-review-loop"
name = "Agent Review Loop"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Automate a local coder and reviewer loop in two Herdr panes"
platforms = ["macos", "linux"]

[[actions]]
id = "start"
title = "Start agent review loop"
contexts = ["workspace"]
command = ["python3", "orchestrator.py"]

[[panes]]
id = "orchestrator"
title = "Agent Review Loop"
placement = "tab"
command = ["python3", "orchestrator.py"]
